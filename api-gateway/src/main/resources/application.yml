server:
  port: 8222

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: account-service
          # lb:// yêu cầu Spring Cloud LoadBalancer phân phối request
          # đến các instance của ACCOUNT-SERVICE đã đăng ký trong Eureka
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/accounts/**

    # Tắt cache của LoadBalancer để cập nhật danh sách instance nhanh hơn
    loadbalancer:
      cache:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
