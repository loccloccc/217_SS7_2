server:
  port: 8082

spring:
  application:
    name: ACCOUNT-SERVICE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: false
    # Instance ID bao gồm port để phân biệt khi chạy nhiều instance trên cùng host
    instance-id: ${spring.application.name}:${server.port}
